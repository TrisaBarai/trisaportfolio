<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="frBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="60%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="blueGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="aiCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" rx="16" fill="url(#frBg)" />

  <!-- Circuit / Neural Connections in Background -->
  <g opacity="0.2" stroke="#38BDF8" stroke-width="1.5" fill="none">
    <path d="M50,80 H180 L230,140 H380 L440,80 H550" />
    <path d="M80,300 H200 L260,220 H340 L400,300 H520" />
    <circle cx="180" cy="80" r="3.5" fill="#38BDF8" />
    <circle cx="230" cy="140" r="3.5" fill="#38BDF8" />
    <circle cx="380" cy="140" r="3.5" fill="#38BDF8" />
    <circle cx="440" cy="80" r="3.5" fill="#38BDF8" />
    <circle cx="260" cy="220" r="3.5" fill="#38BDF8" />
    <circle cx="340" cy="220" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Top System Header Bar -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="540" height="42" rx="8" fill="#1E293B" opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="21" r="5" fill="#EF4444" />
    <circle cx="38" cy="21" r="5" fill="#F59E0B" />
    <circle cx="54" cy="21" r="5" fill="#10B981" />
    <text x="80" y="26" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">AI_Fake_Review_Classifier.py  •  Flask API  •  TF-IDF Model</text>
    <rect x="450" y="10" width="75" height="22" rx="11" fill="#2563EB" opacity="0.3" stroke="#38BDF8" stroke-width="1" />
    <text x="462" y="25" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ONLINE</text>
  </g>

  <!-- Review Sample 1 (Genuine Review - Left) -->
  <g transform="translate(30, 85)" filter="url(#cardDrop)">
    <rect x="0" y="0" width="255" height="155" rx="12" fill="url(#aiCardGrad)" stroke="#10B981" stroke-width="1.5" />
    <!-- Genuine Badge -->
    <rect x="15" y="15" width="92" height="24" rx="12" fill="#10B981" opacity="0.2" />
    <circle cx="27" cy="27" r="4" fill="#10B981" />
    <text x="37" y="31" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="bold">GENUINE 98%</text>

    <!-- Star Ratings -->
    <g fill="#F59E0B" transform="translate(180, 20)">
      <polygon points="5,0 6.5,3.5 10,3.5 7,6 8,9.5 5,7.5 2,9.5 3,6 0,3.5 3.5,3.5" transform="scale(0.8) translate(0,0)" />
      <polygon points="5,0 6.5,3.5 10,3.5 7,6 8,9.5 5,7.5 2,9.5 3,6 0,3.5 3.5,3.5" transform="scale(0.8) translate(14,0)" />
      <polygon points="5,0 6.5,3.5 10,3.5 7,6 8,9.5 5,7.5 2,9.5 3,6 0,3.5 3.5,3.5" transform="scale(0.8) translate(28,0)" />
      <polygon points="5,0 6.5,3.5 10,3.5 7,6 8,9.5 5,7.5 2,9.5 3,6 0,3.5 3.5,3.5" transform="scale(0.8) translate(42,0)" />
      <polygon points="5,0 6.5,3.5 10,3.5 7,6 8,9.5 5,7.5 2,9.5 3,6 0,3.5 3.5,3.5" transform="scale(0.8) translate(56,0)" fill="#475569" />
    </g>

    <!-- Review Text Mockup -->
    <text x="15" y="65" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="500">"Using this device for 3 weeks.</text>
    <text x="15" y="83" fill="#CBD5E1" font-family="sans-serif" font-size="11">Battery lasts around 8 hours on</text>
    <text x="15" y="100" fill="#CBD5E1" font-family="sans-serif" font-size="11">normal workload. Good build quality."</text>

    <!-- Sentiment Meter -->
    <line x1="15" y1="122" x2="240" y2="122" stroke="#334155" stroke-width="1" />
    <text x="15" y="140" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">NLP Sentiment: Balanced Organic</text>
  </g>

  <!-- Review Sample 2 (Fake / Spam Review - Right) -->
  <g transform="translate(315, 85)" filter="url(#cardDrop)">
    <rect x="0" y="0" width="255" height="155" rx="12" fill="url(#aiCardGrad)" stroke="#EF4444" stroke-width="1.5" />
    <!-- Fake Badge -->
    <rect x="15" y="15" width="105" height="24" rx="12" fill="#EF4444" opacity="0.2" />
    <circle cx="27" cy="27" r="4" fill="#EF4444" />
    <text x="37" y="31" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="bold">FAKE / BOT 94%</text>

    <!-- Warning Icon -->
    <g transform="translate(220, 18)" fill="#EF4444">
      <path d="M8,1 L15,14 L1,14 Z" fill="none" stroke="#EF4444" stroke-width="2" />
      <rect x="7" y="6" width="2" height="4" rx="1" fill="#EF4444" />
      <circle cx="8" cy="12" r="1" fill="#EF4444" />
    </g>

    <!-- Review Text Mockup -->
    <text x="15" y="65" fill="#FCA5A5" font-family="sans-serif" font-size="12" font-weight="500">"BEST ITEM EVER BOUGHT!!!!</text>
    <text x="15" y="83" fill="#FCA5A5" font-family="sans-serif" font-size="11">EVERYONE MUST BUY 100%</text>
    <text x="15" y="100" fill="#FCA5A5" font-family="sans-serif" font-size="11">RECOMMENDED CLICK LINK NOW!!!"</text>

    <!-- Spam Flags -->
    <line x1="15" y1="122" x2="240" y2="122" stroke="#334155" stroke-width="1" />
    <text x="15" y="140" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="10">Alert: Hyperbolic &amp; Spam Pattern</text>
  </g>

  <!-- Central AI Analysis Pipeline Bar -->
  <g transform="translate(30, 260)" filter="url(#cardDrop)">
    <rect x="0" y="0" width="540" height="95" rx="12" fill="#0F172A" stroke="#2563EB" stroke-width="1.5" />
    
    <!-- Step 1 -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="105" height="55" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="10" y="24" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">1. Preprocess</text>
      <text x="10" y="42" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Tokenize &amp; Stopwords</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M132,48 L146,48" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)" />
    <polygon points="145,45 152,48 145,51" fill="#38BDF8" />

    <!-- Step 2 -->
    <g transform="translate(155, 20)">
      <rect x="0" y="0" width="105" height="55" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="10" y="24" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">2. Feature Extr.</text>
      <text x="10" y="42" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">TF-IDF Vectorizer</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M267,48 L281,48" stroke="#38BDF8" stroke-width="2" />
    <polygon points="280,45 287,48 280,51" fill="#38BDF8" />

    <!-- Step 3 -->
    <g transform="translate(290, 20)">
      <rect x="0" y="0" width="105" height="55" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="10" y="24" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">3. ML Model</text>
      <text x="10" y="42" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Classifier Engine</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M402,48 L416,48" stroke="#38BDF8" stroke-width="2" />
    <polygon points="415,45 422,48 415,51" fill="#38BDF8" />

    <!-- Step 4 Result -->
    <g transform="translate(425, 20)">
      <rect x="0" y="0" width="95" height="55" rx="8" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5" />
      <text x="8" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">4. SQL Storage</text>
      <text x="8" y="42" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="9">Verdict &amp; Log</text>
    </g>
  </g>
</svg>
